name: Play route health

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
  push:
    paths:
      - 'src/data/games.ts'
      - 'src/lib/playUrl.ts'
      - 'scripts/check-play-routes.mjs'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe every game URL
        id: probe
        continue-on-error: true
        run: node scripts/check-play-routes.mjs | tee play-routes.txt

      - name: Open an issue when a game is unreachable
        if: steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Play route health: a game is unreachable"
          body=$(printf 'The nightly probe could not load a canonical game URL.\n\n```\n%s\n```\n' "$(cat play-routes.txt)")
          existing=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Fail the run
        if: steps.probe.outcome == 'failure'
        run: exit 1
